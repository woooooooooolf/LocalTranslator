[package]
name = "local-translate"
version = "0.3.1"
description = "静译 - CPU 离线翻译"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
tempfile = "3"
fs2 = "0.4"
jingyi-engine = { path = "../crates/engine" }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
