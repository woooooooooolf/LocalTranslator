[package]
name = "local-translate"
version = "0.2.0"
description = "静译 - CPU 离线翻译"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde_json = "1"
tempfile = "3"
fs2 = "0.4"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
