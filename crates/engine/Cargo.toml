[package]
name = "jingyi-engine"
version = "0.3.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sentencepiece-rs = "=0.2.2"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std"] }
regex = "1"
fancy-regex = "0.16"
encoding_rs = "0.8"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
quick-xml = "0.38"
kuchikiki = "0.8"
tempfile = "3"

[dev-dependencies]
sha2 = "0.10"
